ignore:
  # Grype's advisory ranges currently mark every CPython version below 3.15 as
  # affected even though the fixes were backported to the 3.13 branch. These
  # exceptions are deliberately restricted to the exact runtime in the pinned
  # base image. GitHub compare shows each fix commit is an ancestor of v3.13.15.
  - vulnerability: CVE-2026-11940
    package:
      name: python
      version: 3.13.15
      type: binary
    reason: >-
      Fixed by CPython 3.13 backport 771d12dda5140313db0ac550292987975651bbde,
      which is an ancestor of the v3.13.15 release tag.
  - vulnerability: CVE-2026-11972
    package:
      name: python
      version: 3.13.15
      type: binary
    reason: >-
      Fixed by CPython 3.13 backport 3f031d431f80668e14f3bc066bbf4369cd9281b9,
      which is an ancestor of the v3.13.15 release tag.
  - vulnerability: CVE-2026-15308
    package:
      name: python
      version: 3.13.15
      type: binary
    reason: >-
      Fixed by CPython 3.13 backport 7933f4bf7131aa4140750f9404f5de0aa2969ced,
      which is an ancestor of the v3.13.15 release tag.
