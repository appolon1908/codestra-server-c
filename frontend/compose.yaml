services:
  web:
    image: ${IMAGE:-codestra-frontend:local}
    build:
      context: .
      args:
        VITE_API_ENDPOINT: ${VITE_API_ENDPOINT:?set VITE_API_ENDPOINT}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cpus: 1.0
    mem_limit: 256m
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
