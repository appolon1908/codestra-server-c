name: server-c-book-c-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: server_c_staging
      POSTGRES_USER: server_c_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?required}
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server_c_staging -d server_c_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${STAGING_REDIS_PASSWORD:?required}", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${STAGING_REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  backend:
    image: codestra-server-c-backend:book-c-staging
    restart: unless-stopped
    environment:
      SECRET_KEY: ${STAGING_SECRET_KEY:?required}
      DEBUG: "false"
      ENV: staging
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:18080
      CORS_ALLOWED_ORIGINS: http://localhost:18080
      POSTGRES_DB: server_c_staging
      POSTGRES_USER: server_c_staging
      POSTGRES_PASS: ${STAGING_DB_PASSWORD}
      PG_HOST: db
      PG_PORT: "5432"
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${STAGING_REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${STAGING_REDIS_PASSWORD}@redis:6379/2
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
      MIDDLEWARE_GATEWAY_URL: ""
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:18000:8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    volumes: ["static_data:/app/static", "media_data:/app/media"]
    networks: [private]

  frontend:
    image: codestra-server-c-frontend:book-c-staging
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:18080:8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev", "/var/cache/nginx:size=16m,nosuid,nodev", "/var/run:size=4m,nosuid,nodev"]
    networks: [private]

volumes:
  db_data:
  redis_data:
  static_data:
  media_data:

networks:
  private:
    driver: bridge
