name: Required CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit bandit
      - name: Django, migration, and controlled crawler tests
        env:
          DJANGO_SETTINGS_MODULE: CORE.test_settings
          SECRET_KEY: ci-only-secret-key-that-is-more-than-fifty-characters-long
          ALLOWED_HOSTS: localhost,testserver
          CSRF_TRUSTED_ORIGINS: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASS: test
          PG_HOST: localhost
          PG_PORT: "5432"
        run: |
          python -m compileall -q .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test sales_scraper server_c
      - run: bandit -q -lll -r . -x './static,./media,./*/migrations'
      - run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build traceable backend image
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg IMAGE_VERSION=sha-${{ github.sha }} \
            -t codestra-server-c:${{ github.sha }} backend
          docker image inspect codestra-server-c:${{ github.sha }} \
            | jq --exit-status --arg sha "${{ github.sha }}" \
              '.[0].Config.Labels["org.opencontainers.image.revision"] == $sha'
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: codestra-server-c:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  frontend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build traceable frontend image
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg IMAGE_VERSION=sha-${{ github.sha }} \
            -t codestra-server-c-frontend:${{ github.sha }} frontend
          docker image inspect codestra-server-c-frontend:${{ github.sha }} \
            | jq --exit-status --arg sha "${{ github.sha }}" \
              '.[0].Config.Labels["org.opencontainers.image.revision"] == $sha'
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: codestra-server-c-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
