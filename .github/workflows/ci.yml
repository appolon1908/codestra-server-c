name: Required CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Test repository publication intent gate
        working-directory: .
        run: python3 -m unittest discover -s scripts/release -v
      - run: pip install -r requirements.txt pip-audit bandit
      - name: Django, migration, and controlled crawler tests
        env:
          DJANGO_SETTINGS_MODULE: CORE.test_settings
          SECRET_KEY: ci-only-secret-key-that-is-more-than-fifty-characters-long
          ALLOWED_HOSTS: localhost,testserver
          CSRF_TRUSTED_ORIGINS: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASS: test
          PG_HOST: localhost
          PG_PORT: "5432"
        run: |
          python -m compileall -q .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test sales_scraper server_c
      - run: bandit -q -lll -r . -x './static,./media,./*/migrations'
      - run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t codestra-server-c:${{ github.sha }} backend
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: codestra-server-c:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  postgres-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: scraper_certification
          POSTGRES_USER: scraper_certification
          POSTGRES_PASSWORD: ${{ format('disposable-ci-{0}', github.run_id) }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scraper_certification"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Real PostgreSQL migration and concurrent admission regressions
        env:
          DJANGO_SETTINGS_MODULE: CORE.pg_test_settings
          TEST_DATABASE_PASSWORD: ${{ format('disposable-ci-{0}', github.run_id) }}
          SECRET_KEY: disposable-ci-signing-key-never-used-in-production
          ALLOWED_HOSTS: localhost,testserver
          CSRF_TRUSTED_ORIGINS: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          POSTGRES_DB: scraper_certification
          POSTGRES_USER: scraper_certification
          POSTGRES_PASS: ${{ format('disposable-ci-{0}', github.run_id) }}
          PG_HOST: localhost
          PG_PORT: '5432'
          SCRAPER_WORKER_ENABLED: 'false'
          SCRAPER_MIDDLEWARE_DELIVERY_ENABLED: 'false'
        run: python manage.py test sales_scraper.test_certification --verbosity 2
