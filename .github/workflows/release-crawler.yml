name: Protected crawler release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full protected-main commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: crawler-release-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CERTIFIED_SOURCE_SHA: 38daf884aa6afb788f63d4bbbfac8ff1edbd6d68
  IMAGE_NAME: ghcr.io/codestra-srl/codestra-server-c

jobs:
  release:
    name: Publish and attest exact crawler SHA
    runs-on: ubuntu-latest
    steps:
      - name: Reject anything except the certified full SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$CERTIFIED_SOURCE_SHA"

      - name: Check out exact source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out authoritative protected main without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: protected-main

      - name: Verify commit exists and is reachable from protected main
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          test "$(git -C protected-main rev-parse --abbrev-ref HEAD)" = main
          git -C protected-main merge-base --is-ancestor "$REQUESTED_SHA" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C protected-main status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install exact application dependencies and security tools
        working-directory: backend
        run: python -m pip install --requirement requirements.txt pip-audit bandit

      - name: Run Django, migration, crawler, and security checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: CORE.test_settings
          SECRET_KEY: release-ci-only-secret-key-more-than-fifty-characters
          ALLOWED_HOSTS: localhost,testserver
          CSRF_TRUSTED_ORIGINS: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASS: test
          PG_HOST: localhost
          PG_PORT: "5432"
        run: |
          set -euo pipefail
          python -m compileall -q .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test sales_scraper server_c --verbosity 2 | tee ../crawler-tests.txt
          bandit -q -lll -r . -x './static,./media,./*/migrations'
          pip-audit -r requirements.txt

      - name: Scan exact Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact image locally for pre-publication scan
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${REQUESTED_SHA}" \
            --tag "crawler-release-scan:${REQUESTED_SHA}" \
            backend

      - name: Scan exact local image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: crawler-release-scan:${{ inputs.source_sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan exact local image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: crawler-release-scan:${{ inputs.source_sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: grype-report.json

      - name: Authenticate to private GHCR with workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing immutable tag
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE_NAME}:sha-${REQUESTED_SHA}" >/dev/null 2>&1; then
            echo "immutable SHA tag already exists" >&2
            exit 1
          fi

      - name: Publish immutable SHA tag
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}

      - name: Record immutable registry digest and pull by digest
        id: digest
        shell: bash
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$PUBLISHED_DIGEST" > image-digest.txt
          docker pull "${IMAGE_NAME}@${PUBLISHED_DIGEST}"
          revision="$(docker image inspect "${IMAGE_NAME}@${PUBLISHED_DIGEST}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$REQUESTED_SHA"

      - name: Scan pulled registry digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SPDX SBOM from pulled registry digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json

      - name: Attest build provenance to GitHub and GHCR
        id: provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM to GitHub and GHCR
        id: sbom
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify the GHCR package remains private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/codestra-server-c" --jq .visibility)"
          test "$visibility" = private
          printf '%s\n' 'PACKAGE_VISIBILITY=private' > package-visibility.txt

      - name: Independently verify GitHub attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_NAME}@${PUBLISHED_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-crawler.yml" \
            --deny-self-hosted-runners > provenance-verification.txt
          gh attestation verify "oci://${IMAGE_NAME}@${PUBLISHED_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-crawler.yml" \
            --deny-self-hosted-runners > sbom-verification.txt
          gh attestation verify "oci://${IMAGE_NAME}@${PUBLISHED_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-from-oci \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-crawler.yml" \
            --deny-self-hosted-runners > provenance-oci-verification.txt
          gh attestation verify "oci://${IMAGE_NAME}@${PUBLISHED_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-from-oci \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-crawler.yml" \
            --deny-self-hosted-runners > sbom-oci-verification.txt
          test -s provenance-verification.txt
          test -s sbom-verification.txt
          test -s provenance-oci-verification.txt
          test -s sbom-oci-verification.txt

      - name: Prove the crawler worker remains disabled
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            -e SCRAPER_WORKER_ENABLED=false \
            -e SCRAPER_MIDDLEWARE_DELIVERY_ENABLED=false \
            "${IMAGE_NAME}@${PUBLISHED_DIGEST}" \
            manage.py shell -c \
            'from django.conf import settings; assert settings.SCRAPER_WORKER_ENABLED is False; assert settings.SCRAPER_MIDDLEWARE_DELIVERY_ENABLED is False'
          default_cmd="$(docker image inspect "${IMAGE_NAME}@${PUBLISHED_DIGEST}" --format '{{json .Config.Cmd}}')"
          ! grep -qi 'run_scraper_worker' <<<"$default_cmd"
          printf '%s\n' 'SCRAPER_WORKER_ENABLED=false' > worker-disabled-smoke.txt

      - name: Create non-secret release evidence manifest
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["REQUESTED_SHA"],
              "image": os.environ["IMAGE_NAME"],
              "digest": os.environ["PUBLISHED_DIGEST"],
              "provenance_attestation": os.environ["PROVENANCE_URL"],
              "sbom_attestation": os.environ["SBOM_URL"],
              "crawler_worker_enabled": False,
              "middleware_delivery_enabled": False,
              "production_deployment_count": 0,
          }
          Path("release-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
          sha256sum image-digest.txt package-visibility.txt sbom.spdx.json grype-report.json provenance-verification.txt \
            sbom-verification.txt provenance-oci-verification.txt \
            sbom-oci-verification.txt \
            worker-disabled-smoke.txt release-evidence.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload non-secret release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crawler-release-${{ inputs.source_sha }}
          path: |
            image-digest.txt
            package-visibility.txt
            sbom.spdx.json
            grype-report.json
            provenance-verification.txt
            sbom-verification.txt
            provenance-oci-verification.txt
            sbom-oci-verification.txt
            worker-disabled-smoke.txt
            release-evidence.json
            SHA256SUMS
            crawler-tests.txt
          if-no-files-found: error
          retention-days: 90
